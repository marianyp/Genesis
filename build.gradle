plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        url 'https://jitpack.io'
    }

    maven {
        url "https://maven.shedaniel.me"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/genesis.accesswidener")
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Genesis Framework
    implementation "com.github.marianyp:genesis-framework:${project.genesis_framework_version}"

    // Roughly Enough Items
    runtimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    compileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    compileOnly "dev.architectury:architectury-fabric:21.0.2"
}

processResources {
    var expandProps = [
            minecraft_version        : minecraft_version,
            genesis_framework_version: genesis_framework_version,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description,
            mod_page_url             : mod_page_url,
            mod_git_url              : mod_git_url,
            mod_license              : mod_license
    ]

    filesMatching("fabric.mod.json") {
        expand expandProps
    }

    inputs.properties(expandProps)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
